<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de pagina</title>
    <style>
        
        @font-face  {
            font-family: 'montserrat';
            src: url('./font/Montserrat-Regular.ttf');
        }
        
        body {
            height: 100vh;
            background: linear-gradient(to bottom, #191e32, #3b4676, #5a6ab3);
            display: grid;
            align-items: center;
        }
        
        h1 {
            font-size: 20vw;
            font-family: 'montserrat';
            background: linear-gradient(to bottom, #ffaadf, #ff5574, #ff40e7);
            background-clip: text;
            color: transparent;
            text-align: center;
            
        }
        
        
    </style>
</head>
<body>
    
    <h1>Exemplo pagina de destino</h1>
    
</body>
</html>
